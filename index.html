<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToolDrive - Suite de Productividad y Herramientas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 87.3 78'%3E%3Cpath d='m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z' fill='%230066da'/%3E%3Cpath d='m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44c-.8 1.4-1.2 2.95-1.2 4.5h27.5z' fill='%2300ac47'/%3E%3Cpath d='m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z' fill='%23ea4335'/%3E%3Cpath d='m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z' fill='%2300832d'/%3E%3Cpath d='m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z' fill='%232684fc'/%3E%3Cpath d='m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z' fill='%23ffba00'/%3E%3C/svg%3E">
</head>
<body>

  <!-- ==================== HEADER (Estilo Google Drive) ==================== -->
  <header class="drive-header">
    <div class="header-left">
      <div class="logo-container" onclick="setCategory('all')" title="Ir a la página principal">
        <div class="logo-icon">
          <svg viewBox="0 0 87.3 78" width="34" height="34">
            <path d="m6.6 66.85 3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8h-27.5c0 1.55.4 3.1 1.2 4.5z" fill="#0066da"/>
            <path d="m43.65 25-13.75-23.8c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44c-.8 1.4-1.2 2.95-1.2 4.5h27.5z" fill="#00ac47"/>
            <path d="m73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5h-27.502l5.852 11.5z" fill="#ea4335"/>
            <path d="m43.65 25 13.75-23.8c-1.35-.8-2.9-1.2-4.5-1.2h-18.5c-1.6 0-3.15.45-4.5 1.2z" fill="#00832d"/>
            <path d="m59.8 53h-32.3l-13.75 23.8c1.35.8 2.9 1.2 4.5 1.2h50.8c1.6 0 3.15-.45 4.5-1.2z" fill="#2684fc"/>
            <path d="m73.4 26.5-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3l-13.75 23.8 16.15 28h27.45c0-1.55-.4-3.1-1.2-4.5z" fill="#ffba00"/>
          </svg>
        </div>
        <div class="logo-text">Drive <span>Tools</span></div>
      </div>
    </div>

    <!-- Barra de Búsqueda Google Drive (Expandida) -->
    <div class="header-center">
      <div class="search-box">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </span>
        <input type="text" id="searchInput" class="search-input" placeholder="Obtener respuestas de Drive o buscar herramientas (PDF, JPG, QR, MP3, OCR)..." autocomplete="off">
        <div class="search-actions">
          <button id="clearSearchBtn" class="icon-btn" style="display: none;" title="Limpiar búsqueda">✕</button>
        </div>
      </div>
    </div>

    <!-- Interruptor Modo Oscuro estilo iPhone -->
    <div class="header-right">
      <div class="theme-switch-wrapper" title="Modo Oscuro / Modo Claro">
        <button id="themeToggleBtn" class="ios-switch" aria-label="Cambiar a modo oscuro" onclick="toggleTheme()">
          <span class="ios-switch-track">
            <span class="ios-switch-thumb">
              <!-- Icono Sol (Modo Claro) -->
              <svg class="thumb-icon sun-icon" viewBox="0 0 24 24" width="14" height="14">
                <circle cx="12" cy="12" r="4.5" fill="#f59e0b"/>
                <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41m14.14-14.14l-1.41 1.41" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <!-- Icono Luna (Modo Oscuro - Vector Custom) -->
              <svg class="thumb-icon moon-icon" viewBox="0 0 24 24" width="14" height="14">
                <path d="M12.3 2a10 10 0 0 0 1.9 19.8 10 10 0 0 0 7.8-3.7 10 10 0 0 1-9.7-16.1z" fill="#38bdf8"/>
              </svg>
            </span>
          </span>
        </button>
      </div>
    </div>

  </header>

  <!-- ==================== CUERPO PRINCIPAL ==================== -->
  <div class="app-body">

    <!-- ==================== BARRA LATERAL (SIDEBAR) ==================== -->
    <aside class="drive-sidebar">
      <nav id="sidebarNav"></nav>

    </aside>

    <!-- ==================== CONTENEDOR CENTRAL ==================== -->
    <main class="main-wrapper">
      <div class="main-scrollable">

        <!-- Banner de Bienvenida -->
        <div class="welcome-banner">
          <div>
            <h1 class="welcome-title" id="welcomeTitle">Te damos la bienvenida a <strong>Drive</strong></h1>
          </div>
          <div class="quick-filter-pills">
            <button class="filter-pill active" onclick="setCategory('all')">Todos</button>
            <button class="filter-pill" onclick="setCategory('pdf')">PDF</button>
            <button class="filter-pill" onclick="setCategory('image')">Imágenes</button>
            <button class="filter-pill" onclick="setCategory('media')">Audio / Video</button>
            <button class="filter-pill" onclick="setCategory('text')">Texto</button>
            <button class="filter-pill" onclick="setCategory('dev')">Desarrollador</button>
          </div>
        </div>

        <div class="folders-grid" id="foldersGrid"></div>

        <!-- Barra de Controles de Vista -->
        <div class="section-header tools-bar-header">
          <div class="view-controls">
            <div class="view-toggle">
              <button id="btnViewList" class="view-toggle-btn active" title="Vista en lista">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                </svg>
              </button>
              <button id="btnViewGrid" class="view-toggle-btn" title="Vista en cuadrícula">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                  <path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Contenedor dinámico de herramientas (Tabla o Grid) -->
        <div id="toolsListContainer"></div>

      </div>
    </main>
  </div>

  <!-- ==================== MODAL DE HERRAMIENTA INTERACTIVA ==================== -->
  <div id="toolModalBackdrop" class="tool-modal-backdrop" onclick="handleStaticBackdropClick(event)">
    <div class="tool-modal">
      <div class="tool-modal-header">
        <div class="modal-header-left">
          <div id="modalToolIcon" class="modal-tool-icon"></div>
          <div>
            <div id="modalToolTitle" class="modal-tool-title">Herramienta</div>
            <span id="modalToolCategory" class="modal-tool-category">Categoría</span>
          </div>
        </div>
        <div class="modal-header-actions">
          <button class="icon-btn" title="Cerrar" onclick="closeToolModal()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="modalToolBody" class="tool-modal-body"></div>
      <div id="modalToolFooter" class="tool-modal-footer"></div>
    </div>
  </div>

  <!-- ==================== MODAL DE GESTIÓN DE CARPETAS PERSONALIZADAS ==================== -->
  <div id="customFolderModalBackdrop" class="tool-modal-backdrop" onclick="handleStaticBackdropClick(event)">
    <div class="tool-modal folder-modal-container">
      <div class="tool-modal-header">
        <div class="modal-header-left">
          <div class="modal-tool-icon" id="folderModalIcon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="#ea4335"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
          </div>
          <div>
            <div id="folderModalTitle" class="modal-tool-title">Nueva Carpeta Personalizada</div>
            <span class="modal-tool-category">Organizador de herramientas</span>
          </div>
        </div>
        <div class="modal-header-actions">
          <button class="icon-btn" title="Cerrar" onclick="closeFolderModal()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="folderModalBody" class="tool-modal-body"></div>
      <div id="folderModalFooter" class="tool-modal-footer"></div>
    </div>
  </div>

  <!-- ==================== MODAL RÁPIDO ASIGNAR A CARPETA ==================== -->
  <div id="assignToolModalBackdrop" class="tool-modal-backdrop" onclick="handleStaticBackdropClick(event)">
    <div class="tool-modal" style="max-width: 480px;">
      <div class="tool-modal-header">
        <div class="modal-header-left">
          <div class="modal-tool-icon" id="assignModalIcon">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="#0b57d0"><path d="M20 6h-8l-2-2H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-1 8h-3v3h-2v-3h-3v-2h3V9h2v3h3v2z"/></svg>
          </div>
          <div>
            <div id="assignModalTitle" class="modal-tool-title">Añadir a Carpetas</div>
            <span id="assignModalSubtitle" class="modal-tool-category">Organización</span>
          </div>
        </div>
        <div class="modal-header-actions">
          <button class="icon-btn" title="Cerrar" onclick="closeAssignToolModal()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>
      </div>
      <div id="assignModalBody" class="tool-modal-body"></div>
      <div id="assignModalFooter" class="tool-modal-footer"></div>
    </div>
  </div>

  <!-- Contenedor de Notificaciones (Toasts) -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="qr-lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
